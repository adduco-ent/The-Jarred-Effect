<!doctype html><html><head><meta charset="utf-8"><title>sky render</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<canvas id="c"></canvas>
<script>
// Renders a photographic sky for one time of day, or a panorama that runs morning -> dusk -> night, for screenshots.
// Usage: render.html#morning | afternoon | golden | dusk | night | pano   (window size = image size)
var P = {
  morning:  { zen:[0.60,0.73,0.92], hor:[0.99,0.87,0.78], haze:[1.00,0.92,0.85], sunCol:[1.0,0.80,0.58], lit:[1.0,0.94,0.88], shade:[0.70,0.71,0.84], cover:0.41, stars:0.0, sun:[0.26,0.10] },
  afternoon:{ zen:[0.34,0.56,0.88], hor:[0.84,0.90,0.97], haze:[0.92,0.95,0.99], sunCol:[1.0,0.97,0.92], lit:[1.0,1.0,1.0], shade:[0.72,0.77,0.88], cover:0.43, stars:0.0, sun:[0.80,0.90] },
  golden:   { zen:[0.50,0.53,0.80], hor:[0.99,0.76,0.62], haze:[1.00,0.83,0.71], sunCol:[1.0,0.70,0.46], lit:[1.0,0.82,0.74], shade:[0.55,0.50,0.70], cover:0.41, stars:0.0, sun:[0.50,0.07] },
  dusk:     { zen:[0.24,0.25,0.48], hor:[0.93,0.63,0.58], haze:[0.90,0.62,0.62], sunCol:[1.0,0.56,0.46], lit:[0.99,0.70,0.68], shade:[0.30,0.27,0.44], cover:0.42, stars:0.25, sun:[0.50,-0.06] },
  night:    { zen:[0.030,0.055,0.11], hor:[0.14,0.17,0.31], haze:[0.19,0.21,0.35], sunCol:[0.0,0.0,0.0], lit:[0.44,0.49,0.62], shade:[0.06,0.08,0.15], cover:0.47, stars:1.0, sun:[-9,-9] }
};
var key = (location.hash || '#golden').slice(1), pano = key === 'pano';
var A = pano ? P.morning : P[key], M = pano ? P.dusk : P[key], B = pano ? P.night : P[key];
var c = document.getElementById('c');
c.width = innerWidth; c.height = innerHeight;
var gl = c.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
var vs = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
var fs = [
'precision highp float;',
'uniform vec2 R;uniform float pano;',
'uniform vec3 Z[3],H[3],HZ[3],SC[3],L[3],S[3];uniform float CV[3],ST[3];',
'uniform vec2 sun,moon;',
'float h21(vec2 p){p=fract(p*vec2(233.34,851.73));p+=dot(p,p+23.45);return fract(p.x*p.y);}',
'float n2(vec2 p){vec2 i=floor(p),f=fract(p);float a=h21(i),b=h21(i+vec2(1.,0.)),c=h21(i+vec2(0.,1.)),d=h21(i+vec2(1.,1.));vec2 u=f*f*(3.-2.*f);return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);}',
'float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<7;i++){v+=a*n2(p);p=m*p;a*=.5;}return v;}',
'float dens(vec2 q){vec2 w=vec2(fbm(q*.45+3.1),fbm(q*.45+7.7));return fbm(q*1.1+.6*w)*.70+fbm(q*3.+5.3)*.30;}',
'float hs(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
'float cov(float d,float c){return smoothstep(c,c+.28,d);}',
'float off(float e0,float e1,float x){return 1.-smoothstep(e0,e1,x);}',
'void main(){',
'  vec2 uv=gl_FragCoord.xy/R;float asp=R.x/R.y;',
'  float k1=pano>.5?smoothstep(.18,.50,uv.x):0.;float k2=pano>.5?smoothstep(.50,.84,uv.x):0.;',
'  float wA=1.-k1,wM=k1-k2,wB=k2;',
'  vec3 zen=Z[0]*wA+Z[1]*wM+Z[2]*wB,hor=H[0]*wA+H[1]*wM+H[2]*wB,haze=HZ[0]*wA+HZ[1]*wM+HZ[2]*wB;',
'  vec3 sunCol=SC[0]*wA+SC[1]*wM+SC[2]*wB,lit=L[0]*wA+L[1]*wM+L[2]*wB,shade=S[0]*wA+S[1]*wM+S[2]*wB;',
'  float cover=CV[0]*wA+CV[1]*wM+CV[2]*wB,stars=ST[0]*wA+ST[1]*wM+ST[2]*wB;',
'  float t=pow(clamp(uv.y,0.,1.),.55);vec3 col=mix(hor,zen,t);',
'  vec2 p=vec2(uv.x*asp,uv.y);',
'  float day=pano>.5?wA:1.;',
'  vec2 sp=vec2(sun.x*asp,sun.y);float d=distance(p,sp);',
'  float g1=exp(-d*d/.010),g2=exp(-d/.16);',
'  col+=sunCol*(g1*.50+g2*.18)*day;',
'  col+=sunCol*exp(-uv.y*9.)*.18*day;',
'  if(sun.y>0.){col=mix(col,vec3(1.,.985,.95),off(.010,.018,d)*day);}',
'  col+=vec3(1.,.62,.52)*exp(-uv.y*6.)*.30*wM;',
'  col=mix(col,haze,exp(-uv.y*7.)*.5);',
'  if(stars>0.){vec2 g=floor(gl_FragCoord.xy/1.6);float h=hs(g);float s=smoothstep(1.-.0050*stars,1.,h)*smoothstep(.10,.45,uv.y);col+=vec3(.9,.93,1.)*s*(.55+.75*hs(g*1.37+3.1))*stars;',
'    vec2 g2=floor(gl_FragCoord.xy/3.);float hh=hs(g2+11.3);col+=vec3(1.)*smoothstep(1.-.0014*stars,1.,hh)*smoothstep(.15,.55,uv.y)*1.1*stars;}',
'  float night=pano>.5?wB:(moon.x>-1.?1.:0.);',
'  vec2 mp=vec2(moon.x*asp,moon.y);float md=distance(p,mp);float mr=.028;',
'  if(moon.x>-1.){vec3 mc=vec3(.97,.95,.89)*(.84+.16*fbm(p*90.+2.));mc*=1.-.18*smoothstep(.0,mr,distance(p,mp+vec2(.008,.006)));',
'    col=mix(col,mc,off(mr*.94,mr,md)*night);col+=vec3(.6,.66,.85)*exp(-md*md/.004)*.35*night;col+=vec3(.5,.56,.72)*exp(-md/.22)*.10*night;}',
'  float y=uv.y+.16;vec2 q=vec2((p.x-.5*asp)/y,1./y)*vec2(.95,.85);',
'  float d0=dens(q);float c0=cov(d0,cover);',
'  vec2 lp=pano>.5?mix(sun,moon,k2):(sun.y>-1.?sun:moon);',
'  vec2 toL=normalize(lp-uv+1e-4);',
'  float c1=cov(dens(q+toL*.12),cover);',
'  float light=clamp(.58+(c0-c1)*2.2,0.,1.);',
'  vec3 cc=mix(shade,lit,light);',
'  cc+=sunCol*exp(-d*d/.06)*.45*day;',
'  cc=mix(cc,haze,exp(-uv.y*9.)*.4);',
'  float mask=off(.42,.98,uv.y);',
'  col=mix(col,cc,c0*mask*.94);',
'  col+=(h21(gl_FragCoord.xy+7.)-.5)/160.;',
'  gl_FragColor=vec4(col,1.);',
'}'].join('\n');
function sh(t, s) { var o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) document.title = 'ERR ' + gl.getShaderInfoLog(o); return o; }
var pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(pr); gl.useProgram(pr);
var bf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
var al = gl.getAttribLocation(pr, 'a'); gl.enableVertexAttribArray(al); gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
function u(n) { return gl.getUniformLocation(pr, n); }
function v3(name, f) { gl.uniform3fv(u(name), new Float32Array([].concat(f(A), f(M), f(B)))); }
gl.uniform2f(u('R'), c.width, c.height); gl.uniform1f(u('pano'), pano ? 1 : 0);
v3('Z', function (x) { return x.zen; }); v3('H', function (x) { return x.hor; }); v3('HZ', function (x) { return x.haze; });
v3('SC', function (x) { return x.sunCol; }); v3('L', function (x) { return x.lit; }); v3('S', function (x) { return x.shade; });
gl.uniform1fv(u('CV'), new Float32Array([A.cover, M.cover, B.cover])); gl.uniform1fv(u('ST'), new Float32Array([A.stars, M.stars, B.stars]));
gl.uniform2fv(u('sun'), pano ? [0.15, 0.16] : A.sun);
gl.uniform2fv(u('moon'), pano ? [0.87, 0.72] : (key === 'night' ? [0.78, 0.74] : [-9, -9]));
gl.viewport(0, 0, c.width, c.height); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
if (document.title.indexOf('ERR') !== 0) document.title = 'done';
</script></body></html>
