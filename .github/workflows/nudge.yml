# Sends the Other Half daily nudges that are due (api/nudge-send.js), every 15 minutes.
# It runs from GitHub because Vercel's free plan only allows a once-a-day schedule.
# Until the NUDGE_CRON_SECRET repository secret exists, it does nothing and exits quietly.
name: Daily nudges

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send the nudges that are due
        env:
          CRON_SECRET: ${{ secrets.NUDGE_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Nudges aren't set up yet (no NUDGE_CRON_SECRET)."; exit 0; fi
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" https://thejarredeffect.com/api/nudge-send
